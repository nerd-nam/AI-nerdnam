# AI 서버 실행 (ADR-0007). LLM·임베딩은 AWS Bedrock 호출이라 GPU가 필요 없다
#   AWS_BEARER_TOKEN_BEDROCK=... docker compose up -d
services:
  ai:
    build: .
    environment:
      AI_MODE: real
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:?Bedrock API 키 필요}
      LLM_MODEL: ${LLM_MODEL:-deepseek.v3-v1:0}
    ports:
      - "8000:8000"                          # BE만 접근: 보안 그룹에서 API 서버 IP만 허용
    restart: unless-stopped
